databases:
  - name: wave
    plan: free
    databaseName: wave
    user: wave_owner

services:
  - type: web
    plan: free
    name: wave_v1
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn wave_v1.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wave
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
