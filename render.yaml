services:
    - type: web
      name: wave_api
      env: docker
      plan: starter
      dockerfilePath: ./Dockerfile
      envVars:
          - key: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://otlp-gateway-prod-us-east-2.grafana.net/otlp"
          - key: GRAFANA_CLOUD_API_KEY
            value: "glc_eyJvIjoiMTMwOTA4MSIsIm4iOiJ3YXZlX2FwaSIsImsiOiJJMnNoNDIyWTZzcFpZb2VKNWUzVXIyODgiLCJtIjp7InIiOiJwcm9kLXVzLWVhc3QtMCJ9fQ=="
          - key: RESOURCE_ENVIRONMENT
            value: "apiProduction"
    - type: worker
      name: wave-celery-worker
      env: python
      plan: starter
      buildCommand: pip install -r requirements.txt
      startCommand: celery -A apiManager.celery.app.celery_app worker --loglevel=info
      envVars:
          - key: REDIS_URL
            value: redis://red-d22i09p5pdvs73912opg:T4vA1VD5ntHvzep1Ym1P3YsKMPFY8dWK@red-d22i09p5pdvs73912opg:6379
          - key: DJANGO_SETTINGS_MODULE
            value: wave_v1.settings

    - type: worker
      name: wave-celery-beat
      env: python
      plan: starter
      buildCommand: pip install -r requirements.txt
      startCommand: celery -A apiManager.celery.app.celery_app beat --loglevel=info
      envVars:
          - key: REDIS_URL
            value: redis://red-d22i09p5pdvs73912opg:T4vA1VD5ntHvzep1Ym1P3YsKMPFY8dWK@red-d22i09p5pdvs73912opg:6379
          - key: DJANGO_SETTINGS_MODULE
            value: wave_v1.settings
