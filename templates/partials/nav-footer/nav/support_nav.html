{% load static %}
{% load user_tags %}


<link rel="stylesheet" type="text/css" href="{% static "/styles/partials/nav-footer/nav/support_nav.css" %}" />
<script type="text/javascript" src="{% static "/scripts/partials/navigation/navbar.js" %}" defer></script>



<div id="navigation-container" class="max-w-full w-full top-0 right-0 left-0 flex-none">
    <nav class="flex justify-between flex-col pre-lg:flex-row w-full px-4 pre-lg:px-8 lg:px-14 xl:px-24 2xl:px-28 py-5 border-b border-gray-100 shadow-sm pb-6">
        <div id="logo-menu" class="flex justify-center pre-sm:justify-start">
            <div id="logo" class="font-Wanted-ExtraBlack text-2xl">
                <a href="{% url "core:index" %}" class="text-black">WAV<span class="text-[#008d95]">E</span>.</a>
            </div>
        </div>
        <div id="menu-options" class="flex items-center justify-center">
            <ul class="flex flex-row gap-9 list-none font-Wanted-Variable">
                <li>
                    <a href="{% url "support:feedback" %}" class="hover:underline hover:decoration-[#008d95]"> Feedback </a>
                </li>
                <li>
                    <a href="{% url "support:newTicket" %}" class="hover:underline hover:decoration-[#008d95]"> Open <span >a</span> ticket </a>
                </li>
                <li>
                    {% if user.is_authenticated %}
                    <a href="{% url "support:supportPortal" %}" class="hover:underline hover:decoration-[#008d95]"><span class="hidden after-xsm:inline">Support</span> Portal</a>
                    {% else %}
                    <a href="{% url "authentication:login" %}" class="hover:underline hover:decoration-[#008d95]">Sign in</a>
                    {% endif %}
                </li>
            </ul>
        </div>
    </nav>
</div>
