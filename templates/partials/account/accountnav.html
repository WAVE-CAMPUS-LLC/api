{% load static %}

<link rel="stylesheet" type="text/css" href="{% static "/styles/partials/accountnav.css" %}" />

<div id="header">
    <div id="navigation-bar">
        <div id="logo-menu">
            <div id="logo">
                <a href="#">WAVE</a>
            </div>
            <div id="menu">
                <ul>
                    <li><a href="">Discover</a></li>
                    <li><a href="">Host Event</a></li>
                    <li><a href="#">Safety</a></li>
                </ul>
            </div>
        </div>

        <div id="support-links">
            <a id="support-nav" href="{% url "support:home" %}">Support</a>
            <div id="join" >
                {% if user.is_authenticated %}
                <a class="account" href="{% url "accountManagement:userAccount" %}">
                    <img src="{% static "/images/home/account.svg" %}" alt="My Account">
                    <p>{{ user.first_name}}</p>
                </a>
                {% else %}
                <a href="{% url "authentication:join" %}">Join Us</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
