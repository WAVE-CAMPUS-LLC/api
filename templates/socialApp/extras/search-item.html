{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colleges Campuses | WAVE.</title>
  <link rel="stylesheet" type="text/css" href="{% static "/tailwindcss/input.css" %}" />
  <link rel="stylesheet" type="text/css" href="{% static "/tailwindcss/output.css" %}" />
</head>


<div id="html-content" class="flex flex-col gap-[40px] overflow-y-auto h-full">
  <body>
    <div id="content-container" class="pb-[70px] px-[10px] xssm:px-[30px] xxsm:px-[60px] sm:px-[100px] flex flex-col gap-[70px]">
      <div class="request-home-body flex flex-col gap-[20px] text-black">
        <div class="request-item flex flex-col sm:flex-row gap-[20px] justify-between items-center p-[10px]">
          <div class="request-left flex gap-[20px] items-center">
            <div class="request-pfp">
              <img src="{% static "images/socialApp/publicProfile/profile/E.L.png" %}" alt="Profile Picture" class="w-[70px] h-[70px] rounded-[50%]" />
            </div>
            <div class="request-names">
              <h1 class="font-Wanted-Regular text-[22px] text-black font-bold">{{ friend.user.first_name }} {{ friend.user.last_name }}</h1>
            </div>
          </div>
          <div class="request-actions flex gap-[10px]">
            <form method="POST" action="{% url "social:crew" crewId=crew.crewId %}">
              {% csrf_token %}
              <input type="hidden" name="crew_invite " value="{{ request.requestId }}" />
              <button class="accept bg-none border-none cursor-pointer rounded-[50%]" type="button" name="action" value="crew_invite" role="button">
                Send Crew Invite
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>


</div>
