{% extends "base/base.html" %}
{% load static %}


{% block checkout_body %}
<main id="newPasswordCardContainer" class="flex justify-center items-center flex-col gap-y-[20px] pb-14 w-full h-full overflow-y-auto">
    <div id="navHeader" class="w-full flex justify-center pt-[50px]">
        <div id="logo" class="font-Wanted-Black text-[40px]">
            <a href="{% url "core:index" %}" class="text-black ">WAV<span class="text-[#008d95]">E</span>.</a>
        </div>
    </div>
    <div class="w-full flex justify-center h-full">
        <div id="passwordCard" class="flex flex-col gap-y-[20px] bg-white w-[85%] sm:w-[75%] md:w-[55%] pre-lg:w-[30%] pt-[40px] pb-[30px] pl-[25px] md:pl-[50px] pr-[25px] md:pr-[50px] border border-solid border-[rgba(130,130,130,0.094)] rounded-[20px] shadow-custom-shadow">
            <form id="passwordForm"  method="post" action="" class="flex flex-col gap-9">
                {% csrf_token %}
                <div class="input-containers font-Wanted-SemiBold text-[13px] text-black uppercase flex flex-col gap-5 w-full">
                    <div class="input-box flex flex-col gap-[5px] w-full">
                        <label for="id_old_password">Current Password</label>
                        <input type="password" class="p-[10px] pl-[13px] pr-[13px] rounded-[10px] border border-solid border-[rgba(9,9,9,0.108)] font-Wanted-Regular text-[15px] w-full shadow-form-shadow" name="old_password" id="id_old_password" placeholder="Enter your current password" required>
                    </div>
                    <div class="input-box flex flex-col gap-[5px] w-full">
                        <label for="id_new_password1">New Password</label>
                        <input type="password" class="p-[10px] pl-[13px] pr-[13px] rounded-[10px] border border-solid border-[rgba(9,9,9,0.108)] font-Wanted-Regular text-[15px] w-full shadow-form-shadow" name="new_password1" id="id_new_password1" placeholder="Enter New Password" required>
                    </div>
                    <div class="input-box flex flex-col gap-[5px] w-full">
                        <label for="id_new_password2">Confirm New Password</label>
                        <input type="password" class="p-[10px] pl-[13px] pr-[13px] rounded-[10px] border border-solid border-[rgba(9,9,9,0.108)] font-Wanted-Regular text-[15px] w-full shadow-form-shadow" name="new_password2" id="id_new_password2" placeholder="Confirm new password" required>
                    </div>
                </div>
                <div class="submit-form w-full flex justify-center">
                    <button type="submit" class="gradient-btn w-full">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</main>
{%endblock checkout_body %}
