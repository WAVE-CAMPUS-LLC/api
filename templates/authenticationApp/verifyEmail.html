{% extends "base/base.html" %}
{% load static %}
{% load widget_tweaks %}


{% block title %}
Come create the greatest experiences! Join WAVE. 
{% endblock title %}

{% block checkout_body %}
<form method="POST" class="p-10 flex flex-col overflow-hidden max-h-screen h-full min-h-screen items-center justify-between">
    {% csrf_token %}
    <div class="w-full flex justify-center pt-[30px]">
        <div id="logo" class="font-Wanted-Black text-[40px]">
            <a href="{% url "core:index" %}" class="no-underline text-black">WAV<span>E</span>.</a>
        </div>
    </div>

    <div class="flex flex-col gap-y-[20px] h-full bg-white w-[90%] sm:w-[80%] md:w-[60%] pt-[20px] pb-[30px] pl-[25px] md:pl-[50px] pr-[25px] md:pr-[50px]">
        <div id="heading" class="text-black font-Wanted-ExtraBold text-[25px] flex justify-center">
            <h3 class="text-black font-Wanted-Medium text-[22px] sm:text-[25px] md:text-[28px] flex justify-center">Enter the verification code sent to your email</h3>
        </div>
        <label for="verification_code" class="w-full flex justify-center">
            <input type="text" name="verification_code" id="verification_code" class="p-[10px] pl-[13px] pr-[13px] w-1/2 rounded-[10px] border border-solid border-custom-rgba font-Wanted-Regular text-Medium shadow-form-shadow" autofocus>
        </label>
    </div>

    <div class="w-full flex justify-between">
        <button name="action" value="sendEmailCode" type="submit" class="font-Wanted-Bold text-xl bg-[red] text-white px-[20px] py-[10px] rounded-2xl">Resend code</button>
        <button name="action" value="verifyEmailCode" type="submit" class="font-Wanted-Bold text-xl bg-green text-white px-[20px] py-[10px] rounded-2xl">Verify</button>
    </div>
</form>
{% endblock checkout_body %}
