{% extends "base/base.html" %}
{% load static %}

{% block title %}
WAVE — New Password
{% endblock title %}

{% block app_page_style %}
<link rel="stylesheet" type="text/css" href="{% static "/styles/authenticationApp/passwordReset/newPassword.css" %}" />
{% endblock app_page_style %}


{% block auth_body %}
<main id="newPasswordCardContainer">
    <div id="navHeader">
        <div id="logo">
            <a href="../../index.html">WAVE<span>.</span></a>
        </div>
    </div>

    <div id="newPasswordCard">
        <div id="heading">
            <div id="description">
                <h6>
                    Enter your new password
                </h6>
            </div>
        </div>

        <form action="{% url "authentication:passwordReset" uidb64 token %}" method="post">
            {% csrf_token %}
            <div class="input-row">
                <label for="{{ form.password.id_for_label }}">
                    {{ form.password.label }}
                    <input type="{{ form.password.field.widget.input_type }}" name="{{ form.password.html_name }}" id="{{ form.password.auto_id }}" required>
                </label>
            </div>
            <div class="input-row">
                <label for="{{ form.confirm_password.id_for_label }}">
                    {{ form.confirm_password.label }}
                    <input type="{{ form.confirm_password.field.widget.input_type }}" name="{{ form.confirm_password.html_name }}" id="{{ form.confirm_password.auto_id }}" required>
                </label>
            </div>
            <div id="controlledElements">
                <button type="submit" role="button">Proceed</button>
            </div>
        </form>
    </div>
</main>    
{% endblock auth_body %}
