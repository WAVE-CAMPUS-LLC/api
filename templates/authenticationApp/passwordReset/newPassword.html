{% extends "base/base.html" %}
{% load static %}

{% block title %}
WAVE — New Password
{% endblock title %}

{% block app_page_style %}
<link rel="stylesheet" type="text/css" href="{% static "/styles/authenticationApp/password_change.css" %}" />
<script src="https://kit.fontawesome.com/7d7930b405.js" crossorigin="anonymous" ></script>
{% endblock app_page_style %}


{% block auth_body %}
<main id="card_container">
    <div id="card">
        <div id="heading">
            <div id="icon">
                <i class="fa-solid fa-unlock"></i>
            </div>
            <div id="header">
                <h3>New Password</h3>
            </div>
        </div>
        <form action="post">
            <div id="input_containers">
                <div id="row">
                    <input
                        type="password"
                        name="password"
                        id="password"
                        required
                    />
                    <label for="password">Password</label>
                </div>
                <div id="row">
                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        required
                    />
                    <label for="confirm_password"
                        >Confirm Password</label
                    >
                </div>
            </div>
            <div id="submit">
                <button type="submit">Confirm Change</button>
            </div>
        </form>
    </div>
</main>
{% endblock auth_body %}
