{% extends "base/base.html" %}
{% load static %}

{% block title %}
Reset Password | WAVE.
{% endblock title %}

{% block app_page_style %}
<link rel="stylesheet" type="text/css" href="{% static "/styles/authenticationApp/forgot_password.css" %}" />
{% endblock app_page_style %}


{% block auth_body %}
<main id="forgotCardContainer">
    <header id="navHeader">
        <div id="logo">
            <a href="{% url "core:index" %}">WAVE<span>.</span></a>
        </div>
    </header>
    <div id="forgotCard">
        <form action="{% url "authentication:forgot" %}" method="post">
            {% csrf_token %}
            <div class="input-box">
                <label for="{{ emailForm.email.id_for_label }}">
                    {{ emailForm.email.label }}
                    <input type="{{ emailForm.email.field.widget.input_type }}" name="{{ emailForm.email.html_name }}" id="{{ emailForm.email.auto_id }}" required>
                </label>
            </div>

            <div id="controlledElements">
                <button type="submit" role="button">Proceed</button>
            </div>
        </form>
    </div>
</main>
{% endblock auth_body %}
