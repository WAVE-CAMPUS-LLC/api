{% extends "base/base.html" %}
{% load static %}

{% block title %}
Reset Password | WAVE.
{% endblock title %}

{% block app_page_style %}
<link rel="stylesheet" type="text/css" href="{% static "/styles/authenticationApp/forgot_password.css" %}" />
{% endblock app_page_style %}


{% block auth_body %}
<main id="forgotCardContainer">
    <header id="navHeader">
        <div id="logo">
            <a href="{% url "core:index" %}">WAVE<span>.</span></a>
        </div>
    </header>
    <div id="forgotCard">
        <form action="" method="post">
            {% csrf_token %}
            <div class="input-box">
                <label>
                    Enter your email
                    <input type="email" name="resetEmail" id="resetEmail">
                </label>
            </div>

            <div id="controlledElements">
                <button type="submit" role="button">Proceed</button>
            </div>
        </form>
    </div>
</main>
{% endblock auth_body %}
